# Single-node Loki on the filesystem. No object store, no ring to speak of, no auth.
#
# `auth_enabled: false` does not mean "open to everyone" — it means Loki does not read a
# tenant header and files everything under one tenant. What keeps this private is the port
# binding in the compose file.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # The default is `info`, which narrates every flush. The interesting logs here are the
  # ones being stored, not the ones the store writes about itself.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    # v13 + tsdb is the current pairing. An older schema still works and quietly gives up
    # structured metadata, which is where a log line's own fields live.
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Thirty days. Enforced by the compactor below — a retention period with no compactor to
  # apply it is a setting that reads as a promise and deletes nothing.
  retention_period: 720h
  allow_structured_metadata: true
  volume_enabled: true
  # A local stack that suddenly logs a lot should slow down rather than start dropping
  # lines. These are well above what six services produce.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_series: 5000

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  compaction_interval: 10m
  retention_delete_delay: 2h

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

# Nothing is sent home from a log store holding production output.
analytics:
  reporting_enabled: false
